<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Master Wallet App</title>
    <style>
        body { font-family: sans-serif; background: #5D4037; padding: 20px; color: #fff; }
        .container { max-width: 500px; margin: auto; background: #D7CCC8; padding: 25px; border-radius: 20px; color: #333; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        input { width: 90%; padding: 12px; margin: 8px 0; border: 1px solid #8D6E63; border-radius: 10px; }
        button { width: 95%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: 600; margin-top: 10px; }
        .btn-withdraw { background: #BF360C; }
        #adminPanel { display: none; margin-top: 20px; border-top: 2px solid #5D4037; padding-top: 20px; }
        .req-card { background: #EFEBE9; padding: 10px; margin: 10px 0; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <button onclick="openAdmin()" style="background:none; color:black; font-size:25px; float:right; border:none;">⚙️</button>
    
    <div id="walletUI">
        <h2>My Wallet</h2>
        <div style="background:#fff; padding:10px; border-radius:10px; margin:10px 0;">
            <p>ID: <span id="myUserId">Loading...</span></p>
            <h1>Balance: ₹<span id="displayBal">0</span></h1>
        </div>
        <input type="number" id="amount" placeholder="Amount">
        <input type="text" id="upi" placeholder="UPI ID">
        <button class="btn-withdraw" onclick="doWithdraw()">Withdraw</button>
    </div>

    <div id="adminPanel">
        <h3>Admin Manager</h3>
        <input type="text" id="searchId" placeholder="User ID dalo...">
        <button style="background:#5D4037;" onclick="doSearch()">Search</button>

        <div id="userDetails" style="display:none; background:#fff; padding:15px; margin-top:10px; border-radius:10px;">
            <p>ID: <span id="resId"></span></p>
            <p>Balance: ₹<span id="resBal"></span></p>
            <input type="number" id="newAmount" placeholder="New Balance">
            <button style="background:#2E7D32;" onclick="doUpdate()">Update Balance</button>
        </div>
        <hr>
        <h4>Requests</h4>
        <div id="requestList"></div>
        <button style="background:#795548;" onclick="closeAdmin()">Close Admin</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, get, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const db = getDatabase(initializeApp({
        apiKey: "AIzaSyADNhc_srwV67Lm_2rYRzJHdo0mBFa3c1k",
        authDomain: "ff-id-sell-8.firebaseapp.com",
        databaseURL: "https://ff-id-sell-8-default-rtdb.firebaseio.com",
        projectId: "ff-id-sell-8",
        storageBucket: "ff-id-sell-8.appspot.com",
        messagingSenderId: "885667151549",
        appId: "1:885667151549:web:078e74d8e86e8aa2a341d4"
    }));

    let userId = localStorage.getItem('myPermanentID') || "USER_" + Math.floor(Math.random() * 9000 + 1000);
    localStorage.setItem('myPermanentID', userId);
    document.getElementById('myUserId').innerText = userId;

    let currentBalance = 0;
    onValue(ref(db, 'users/' + userId + '/balance'), (snapshot) => {
        currentBalance = parseInt(snapshot.val() || 0);
        document.getElementById('displayBal').innerText = currentBalance;
    });

    // Global Functions jo buttons call karenge
    window.openAdmin = () => {
        let pass = prompt("Enter Password:");
        if (pass === "9075") {
            document.getElementById('walletUI').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            fetchRequests();
        } else { alert("Galat Password!"); }
    };

    window.closeAdmin = () => {
        document.getElementById('walletUI').style.display = 'block';
        document.getElementById('adminPanel').style.display = 'none';
    };

    window.doWithdraw = () => {
        let amount = parseInt(document.getElementById('amount').value);
        if (amount > currentBalance) { alert("Balance kam hai!"); return; }
        if (amount) {
            push(ref(db, 'withdrawals/'), { userId, amount, status: "Pending" });
            update(ref(db, 'users/' + userId), { balance: currentBalance - amount });
            alert("Request Sent!");
        }
    };

    window.doSearch = async () => {
        let id = document.getElementById('searchId').value.trim();
        const snapshot = await get(ref(db, 'users/' + id + '/balance'));
        if (snapshot.exists()) {
            document.getElementById('resId').innerText = id;
            document.getElementById('resBal').innerText = snapshot.val();
            document.getElementById('userDetails').style.display = 'block';
        } else { alert("User nahi mila!"); }
    };

    window.doUpdate = () => {
        let id = document.getElementById('resId').innerText;
        let amount = document.getElementById('newAmount').value;
        set(ref(db, 'users/' + id + '/balance'), parseInt(amount));
        alert("Balance Update ho gaya!");
    };

    window.fetchRequests = () => {
        onValue(ref(db, 'withdrawals/'), (snapshot) => {
            const listDiv = document.getElementById('requestList');
            listDiv.innerHTML = "";
            const data = snapshot.val();
            if(data) {
                for (let id in data) {
                    if (data[id].status === "Pending") {
                        listDiv.innerHTML += `<div class="req-card">
                            <p>User: ${data[id].userId} | ₹${data[id].amount}</p>
                            <button style="background:green;" onclick="approve('${id}')">Approve</button>
                        </div>`;
                    }
                }
            }
        });
    };

    window.approve = (id) => {
        update(ref(db, 'withdrawals/' + id), { status: "Approved" });
        alert("Approved!");
    };
</script>
</body>
</html>
