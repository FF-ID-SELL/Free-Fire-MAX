<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Wallet</title>
    <!-- Google Font Import -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            width: 100%; 
            max-width: 400px; 
            background: white; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        .header { display: flex; align-items: center; gap: 12px; color: #333; margin-bottom: 20px; }
        .balance-box { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            padding: 25px; 
            border-radius: 15px; 
            text-align: center; 
            margin-bottom: 20px;
        }
        input { 
            width: 92%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 2px solid #eee; 
            border-radius: 10px; 
            font-family: 'Poppins', sans-serif;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #764ba2; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background: #5a377d; }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li { 
            background: #f9f9f9; 
            padding: 12px 15px; 
            margin: 8px 0; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#764ba2"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8h16v10zm-2-5h-3v-2h3v2z"/></svg>
        <h2 style="margin:0;">My Wallet</h2>
    </div>
    
    <div class="balance-box">
        <div style="font-size: 14px; opacity: 0.8;">Current Balance</div>
        <h1 id="balance" style="margin: 5px 0;">₹0</h1>
    </div>
    
    <input type="text" id="desc" placeholder="Transaction Name (e.g. Exam Fees)">
    <input type="number" id="amount" placeholder="Amount (+ for Income, - for Expense)">
    <button onclick="addTransaction()">Add Transaction</button>

    <ul id="list"></ul>
</div>

<script>
    let balance = 0;
    function addTransaction() {
        let desc = document.getElementById('desc').value;
        let amount = parseFloat(document.getElementById('amount').value);
        
        if (desc && !isNaN(amount)) {
            balance += amount;
            document.getElementById('balance').innerText = `₹${balance}`;
            
            let li = document.createElement('li');
            li.innerHTML = `${desc} <b>${amount > 0 ? '+' : ''}${amount}</b>`;
            document.getElementById('list').appendChild(li);
            
            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
        } else {
            alert("Sahi details enter karein!");
        }
    }
</script>

</body>
</html>
