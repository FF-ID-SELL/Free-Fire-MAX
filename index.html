<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Master Wallet System</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select { width: 90%; padding: 10px; margin: 10px 0; }
        button { width: 95%; padding: 12px; background: #764ba2; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="app">
    <h3>Wallet Balance: ₹<span id="bal">1000</span></h3>
    <input type="number" id="wAmount" placeholder="Withdraw Amount">
    <input type="text" id="upi" placeholder="Enter UPI ID">
    <button onclick="requestWithdraw()">Withdraw Request</button>
</div>

<script>
    let balance = 1000; // Demo balance

    function requestWithdraw() {
        let amount = parseFloat(document.getElementById('wAmount').value);
        let upi = document.getElementById('upi').value;

        if (amount > balance) {
            alert("Insufficient Balance!");
            return;
        }

        if (amount && upi) {
            // Request ko save karna (Panel ke liye)
            let requests = JSON.parse(localStorage.getItem('withdraw_requests') || "[]");
            requests.push({ user: "Deepak", amount: amount, upi: upi, status: "Pending" });
            localStorage.setItem('withdraw_requests', JSON.stringify(requests));
            
            balance -= amount;
            document.getElementById('bal').innerText = balance;
            alert("Withdrawal Pending! 15 din mein approve ho jayega.");
        }
    }
</script>
</body>
</html>
