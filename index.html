<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; }
        input { width: 90%; padding: 10px; margin: 5px 0; }
        button { padding: 10px 20px; cursor: pointer; }
        .user-details { background: #e8f4fd; padding: 15px; margin-top: 10px; border-radius: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h3>Admin Panel: User Manager</h3>
    <input type="text" id="searchId" placeholder="User ID dalo...">
    <button onclick="searchUser()">Search User</button>

    <div id="userDetails" class="user-details">
        <p>ID: <span id="resId"></span></p>
        <p>Balance: ₹<span id="resBal"></span></p>
        <input type="number" id="newAmount" placeholder="New Balance Amount">
        <button onclick="updateUserBal()">Update Balance</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const db = getDatabase(initializeApp({
        apiKey: "AIzaSyADNhc_srwV67Lm_2rYRzJHdo0mBFa3c1k",
        authDomain: "ff-id-sell-8.firebaseapp.com",
        databaseURL: "https://ff-id-sell-8-default-rtdb.firebaseio.com",
        projectId: "ff-id-sell-8",
        storageBucket: "ff-id-sell-8.appspot.com",
        messagingSenderId: "885667151549",
        appId: "1:885667151549:web:078e74d8e86e8aa2a341d4"
    }));

    window.searchUser = async function() {
        let id = document.getElementById('searchId').value;
        const snapshot = await get(ref(db, 'users/' + id + '/balance'));
        
        if (snapshot.exists()) {
            document.getElementById('resId').innerText = id;
            document.getElementById('resBal').innerText = snapshot.val();
            document.getElementById('userDetails').style.display = 'block';
        } else {
            alert("User nahi mila!");
        }
    };

    window.updateUserBal = function() {
        let id = document.getElementById('resId').innerText;
        let amount = document.getElementById('newAmount').value;
        set(ref(db, 'users/' + id + '/balance'), amount);
        alert("Balance update ho gaya!");
    };
</script>

</body>
</html>
