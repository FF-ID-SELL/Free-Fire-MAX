<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Wallet App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 40px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; }
        .admin-trigger { position: absolute; top: 10px; right: 10px; padding: 5px; font-size: 10px; cursor: pointer; border: none; background: #ddd; }
        input { width: 92%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 10px; font-size: 16px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: 600; font-size: 16px; margin-top: 10px; }
        .btn-withdraw { background: #e74c3c; }
        #adminPanel { display: none; margin-top: 30px; border-top: 2px solid #764ba2; padding-top: 20px; }
        .req-card { background: #f9f9f9; padding: 15px; margin: 10px 0; border-radius: 10px; border-left: 5px solid #764ba2; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <button class="admin-trigger" onclick="toggleAdmin()">Admin</button>
    
    <div id="walletUI">
        <h2>User Wallet</h2>
        <h1 id="displayBal">₹0</h1>
        <input type="number" id="amount" placeholder="Amount">
        <input type="text" id="upi" placeholder="UPI ID">
        <button class="btn-withdraw" onclick="requestWithdraw()">Withdraw</button>
    </div>

    <div id="adminPanel">
        <h3>Admin Panel</h3>
        <input type="text" id="targetId" placeholder="User ID">
        <input type="number" id="newBal" placeholder="Set New Balance">
        <button style="background:#3498db;" onclick="updateUserBalance()">Update Balance</button>
        <hr>
        <h4>Requests</h4>
        <div id="requestList"></div>
        <button style="background:#777;" onclick="toggleAdmin()">Close Panel</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyADNhc_srwV67Lm_2rYRzJHdo0mBFa3c1k",
        authDomain: "ff-id-sell-8.firebaseapp.com",
        databaseURL: "https://ff-id-sell-8-default-rtdb.firebaseio.com",
        projectId: "ff-id-sell-8",
        storageBucket: "ff-id-sell-8.appspot.com",
        messagingSenderId: "885667151549",
        appId: "1:885667151549:web:078e74d8e86e8aa2a341d4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.toggleAdmin = function() {
        let pass = prompt("Password:");
        if (pass === "9075") {
            document.getElementById('walletUI').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            fetchRequests();
        } else if (pass === null) {
            document.getElementById('walletUI').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
        } else { alert("Wrong Pass!"); }
    };

    window.updateUserBalance = function() {
        let id = document.getElementById('targetId').value;
        let bal = document.getElementById('newBal').value;
        if(id && bal) {
            set(ref(db, 'users/' + id), { balance: bal });
            alert("Balance Updated!");
        }
    };

    window.requestWithdraw = function() {
        let amount = document.getElementById('amount').value;
        let upi = document.getElementById('upi').value;
        if (amount && upi) {
            push(ref(db, 'withdrawals/'), { amount, upi, status: "Pending" });
            alert("Request sent!");
        }
    };

    function fetchRequests() {
        onValue(ref(db, 'withdrawals/'), (snapshot) => {
            const listDiv = document.getElementById('requestList');
            listDiv.innerHTML = "";
            const data = snapshot.val();
            for (let id in data) {
                if (data[id].status === "Pending") {
                    listDiv.innerHTML += `
                        <div class="req-card">
                            <p>₹${data[id].amount} | ${data[id].upi}</p>
                            <button style="background:green;" onclick="updateStatus('${id}', 'Approved')">Approve</button>
                            <button style="background:red;" onclick="updateStatus('${id}', 'Rejected')">Reject</button>
                        </div>
                    `;
                }
            }
        });
    }

    window.updateStatus = function(id, status) {
        update(ref(db, 'withdrawals/' + id), { status: status });
    };
</script>

</body>
</html>
