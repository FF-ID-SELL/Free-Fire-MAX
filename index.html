<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Wallet App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; }
        .invisible-btn { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; background: transparent; border: none; cursor: pointer; }
        input { width: 90%; padding: 12px; margin: 8px 0; border: 2px solid #eee; border-radius: 10px; }
        button { width: 95%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: 600; margin-top: 10px; }
        .btn-add { background: #27ae60; }
        .btn-withdraw { background: #e74c3c; }
        .admin-panel { display: none; background: #fff; border: 2px solid #764ba2; padding: 20px; margin-top: 20px; border-radius: 15px; text-align: left; }
        .req-card { background: #f9f9f9; padding: 10px; margin: 10px 0; border-radius: 8px; border-left: 5px solid #764ba2; }
    </style>
</head>
<body>

<div class="container">
    <button class="invisible-btn" onclick="openAdminPanel()"></button>
    <h2>User Wallet</h2>
    <h1 id="balance">₹0</h1>
    
    <input type="number" id="amount" placeholder="Amount">
    <input type="text" id="upi" placeholder="UPI ID">
    
    <button class="btn-add" onclick="alert('Balance Added!')">Add Money</button>
    <button class="btn-withdraw" onclick="requestWithdraw()">Withdraw</button>

    <div id="adminPanel" class="admin-panel">
        <h3 style="text-align:center;">Admin Panel</h3>
        <div id="requestList">Loading requests...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyADNhc_srwV67Lm_2rYRzJHdo0mBFa3c1k",
        authDomain: "ff-id-sell-8.firebaseapp.com",
        databaseURL: "https://ff-id-sell-8-default-rtdb.firebaseio.com",
        projectId: "ff-id-sell-8",
        storageBucket: "ff-id-sell-8.appspot.com",
        messagingSenderId: "885667151549",
        appId: "1:885667151549:web:078e74d8e86e8aa2a341d4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Admin Panel Logic
    window.openAdminPanel = function() {
        let pass = prompt("Enter Admin Password:");
        if (pass === "9075") {
            document.getElementById('adminPanel').style.display = 'block';
            fetchRequests();
        } else {
            alert("Galat Password!");
        }
    };

    window.requestWithdraw = function() {
        let amount = document.getElementById('amount').value;
        let upi = document.getElementById('upi').value;
        if (amount && upi) {
            push(ref(db, 'withdrawals/'), { amount, upi, status: "Pending" });
            alert("Withdrawal Pending! 15 din mein approve hoga.");
        }
    };

    function fetchRequests() {
        onValue(ref(db, 'withdrawals/'), (snapshot) => {
            const listDiv = document.getElementById('requestList');
            listDiv.innerHTML = "";
            const data = snapshot.val();
            for (let id in data) {
                if (data[id].status === "Pending") {
                    listDiv.innerHTML += `
                        <div class="req-card">
                            <p>₹${data[id].amount} | ${data[id].upi}</p>
                            <button style="background:green;" onclick="updateStatus('${id}', 'Approved')">Approve</button>
                            <button style="background:red;" onclick="updateStatus('${id}', 'Rejected')">Reject</button>
                        </div>
                    `;
                }
            }
        });
    }

    window.updateStatus = function(id, status) {
        update(ref(db, 'withdrawals/' + id), { status: status });
        alert("Status: " + status);
    };
</script>

</body>
</html>
